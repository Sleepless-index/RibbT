name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # yt-dlp needs a JavaScript runtime to solve YouTube's signature challenges. QuickJS is tiny, so
      # it is built here for arm64 Android with the NDK that ships on the runner and packaged as
      # libqjs.so, next to libffmpeg.so, in the native library directory.
      - name: Build QuickJS (JavaScript runtime for yt-dlp)
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          test -d "$NDK" || { echo "Android NDK not found on the runner"; exit 1; }
          git clone --depth 1 https://github.com/quickjs-ng/quickjs.git "$RUNNER_TEMP/quickjs"
          cmake -S "$RUNNER_TEMP/quickjs" -B "$RUNNER_TEMP/quickjs-build" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build "$RUNNER_TEMP/quickjs-build" --target qjs_exe -j"$(nproc)" \
            || cmake --build "$RUNNER_TEMP/quickjs-build" --target qjs -j"$(nproc)"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$RUNNER_TEMP/quickjs-build/qjs" app/src/main/jniLibs/arm64-v8a/libqjs.so
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip app/src/main/jniLibs/arm64-v8a/libqjs.so || true
          ls -lh app/src/main/jniLibs/arm64-v8a/libqjs.so

      # The bundled ffmpeg (and the libraries unpacked next to it) need the C++ runtime, which no
      # other dependency ships. Without it ffmpeg dies with: library "libc++_shared.so" not found.
      - name: Add the C++ runtime for ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          LIB="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -f "$LIB" || { echo "libc++_shared.so not found in the NDK"; exit 1; }
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$LIB" app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          ls -lh app/src/main/jniLibs/arm64-v8a/libc++_shared.so

      - name: Add the libraries the bundled ffmpeg still needs
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://packages.termux.dev/apt/termux-main
          curl -fsSL "$BASE/dists/stable/main/binary-aarch64/Packages" -o "$RUNNER_TEMP/Packages"
          rm -rf "$RUNNER_TEMP/extra" "$RUNNER_TEMP/extra-root"
          mkdir -p "$RUNNER_TEMP/extra" app/src/main/assets
          rm -f app/src/main/assets/ffmpeg-extra.zip
          for pkg in libexpat libjpeg-turbo openssl libandroid-support libandroid-execinfo libandroid-posix-semaphore; do
            FILE=$(awk -v p="$pkg" '$1=="Package:"{hit=($2==p)} hit&&$1=="Filename:"{print $2; exit}' "$RUNNER_TEMP/Packages")
            test -n "$FILE" || { echo "$pkg not found in the Termux repository"; exit 1; }
            curl -fsSL "$BASE/$FILE" -o "$RUNNER_TEMP/$pkg.deb"
            mkdir -p "$RUNNER_TEMP/extra-root/$pkg"
            dpkg-deb -x "$RUNNER_TEMP/$pkg.deb" "$RUNNER_TEMP/extra-root/$pkg"
            cp -L "$RUNNER_TEMP/extra-root/$pkg"/data/data/com.termux/files/usr/lib/lib*.so* "$RUNNER_TEMP/extra/"
          done
          (cd "$RUNNER_TEMP/extra" && zip -qr "$GITHUB_WORKSPACE/app/src/main/assets/ffmpeg-extra.zip" .)
          unzip -l app/src/main/assets/ffmpeg-extra.zip

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -nE "^e: |error:|FAILURE|What went wrong|Could not" build.log | head -60 || true

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/RibbT.apk
          ls -lh out/RibbT.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RibbT-apk
          path: out/RibbT.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commit the last "latest" release was built from. The tag may not exist yet (first run,
          # or the release was removed by hand), so a miss is fine and just means a shorter changelog.
          PREVIOUS=$(git rev-parse -q --verify "refs/tags/latest^{commit}" 2>/dev/null || true)
          VERSION="0.1.${{ github.run_number }}"
          python3 .github/scripts/changelog.py "$VERSION" "$PREVIOUS" HEAD "$GITHUB_REPOSITORY" > notes.md
          cat notes.md
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/RibbT.apk --target "$GITHUB_SHA" --title "RibbT $VERSION" --notes-file notes.md
