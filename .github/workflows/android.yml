name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The release is only built and published when the server's tests pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg and the server's dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install "flask>=3.0" "requests>=2.31" yt-dlp yt-dlp-ejs certifi websockets mutagen defusedxml pillow
      - name: Server tests
        working-directory: server
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # yt-dlp needs a JavaScript runtime to solve YouTube's signature challenges. QuickJS is tiny, so
      # it is built here for arm64 Android with the NDK that ships on the runner and packaged as
      # libqjs.so, next to libffmpeg.so, in the native library directory.
      - name: Build QuickJS (JavaScript runtime for yt-dlp)
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          test -d "$NDK" || { echo "Android NDK not found on the runner"; exit 1; }
          git clone --depth 1 https://github.com/quickjs-ng/quickjs.git "$RUNNER_TEMP/quickjs"
          cmake -S "$RUNNER_TEMP/quickjs" -B "$RUNNER_TEMP/quickjs-build" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build "$RUNNER_TEMP/quickjs-build" --target qjs_exe -j"$(nproc)" \
            || cmake --build "$RUNNER_TEMP/quickjs-build" --target qjs -j"$(nproc)"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$RUNNER_TEMP/quickjs-build/qjs" app/src/main/jniLibs/arm64-v8a/libqjs.so
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip app/src/main/jniLibs/arm64-v8a/libqjs.so || true
          ls -lh app/src/main/jniLibs/arm64-v8a/libqjs.so

      # The lean ffmpeg (no AV1 / H.265 / VP9 encoders) is built by ffmpeg-lite.yml and published as the
      # ffmpeg-lite release. The two programs go in as native libraries so Android lets the app run them;
      # the shared libraries they need travel as one zip in the assets and are unpacked on first run.
      - name: Fetch the lean ffmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ffmpeg"
          mkdir -p "$RUNNER_TEMP/ffmpeg" app/src/main/jniLibs/arm64-v8a app/src/main/assets
          gh release download ffmpeg-lite --pattern ffmpeg-lean.zip --dir "$RUNNER_TEMP/ffmpeg"
          unzip -q "$RUNNER_TEMP/ffmpeg/ffmpeg-lean.zip" -d "$RUNNER_TEMP/ffmpeg/x"
          cp "$RUNNER_TEMP/ffmpeg/x/bin/ffmpeg" app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          cp "$RUNNER_TEMP/ffmpeg/x/bin/ffprobe" app/src/main/jniLibs/arm64-v8a/libffprobe.so
          rm -f app/src/main/assets/ffmpeg-libs.zip app/src/main/assets/ffmpeg-extra.zip
          (cd "$RUNNER_TEMP/ffmpeg/x" && zip -qr "$GITHUB_WORKSPACE/app/src/main/assets/ffmpeg-libs.zip" usr)
          ls -lh app/src/main/jniLibs/arm64-v8a app/src/main/assets

      # The APK is signed with the key from the repository secrets; without it the build stops.
      - name: Prepare the signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RIBBT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RIBBT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the key from the repository secrets."
          else
            echo "::error::The RIBBT_KEYSTORE_BASE64 secret is missing, so the APK can't be signed."
            exit 1
          fi

      - name: Build release APK
        shell: bash
        env:
          RIBBT_KEYSTORE_PASSWORD: ${{ secrets.RIBBT_KEYSTORE_PASSWORD }}
          RIBBT_KEY_ALIAS: ${{ secrets.RIBBT_KEY_ALIAS }}
          RIBBT_KEY_PASSWORD: ${{ secrets.RIBBT_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -nE "^e: |error:|FAILURE|What went wrong|Could not" build.log | head -60 || true

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/RibbT.apk
          ls -lh out/RibbT.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RibbT-apk
          path: out/RibbT.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commit the last "latest" release was built from. The tag may not exist yet (first run,
          # or the release was removed by hand), so a miss is fine and just means a shorter changelog.
          PREVIOUS=$(git rev-parse -q --verify "refs/tags/latest^{commit}" 2>/dev/null || true)
          VERSION="0.1.${{ github.run_number }}"
          python3 .github/scripts/changelog.py "$VERSION" "$PREVIOUS" HEAD "$GITHUB_REPOSITORY" > notes.md
          cat notes.md
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/RibbT.apk --target "$GITHUB_SHA" --title "RibbT $VERSION" --notes-file notes.md
